<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopHub</title>
<style>
  :root { --ink:#16202a; --muted:#5d6b78; --line:#dfe4e8; --bg:#f6f7f5; --card:#fff; --accent:#0b6e4f; --warn:#b45309; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Arial, sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--ink); color:#fff; }
  .wrap { max-width:1000px; margin:0 auto; padding:0 16px; }
  .bar { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; padding-block:18px; }
  .logo { font-weight:800; font-size:1.4rem; letter-spacing:.02em; }
  .tag { color:#b8c4cf; font-size:.9rem; }
  h1 { font-size:1.5rem; margin:28px 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:16px; padding-bottom:40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; display:flex; flex-direction:column; }
  .tile { height:120px; display:grid; place-items:center; font-size:2.6rem; font-weight:800; color:#fff; }
  .body { padding:14px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .name { font-weight:700; }
  .desc { color:var(--muted); font-size:.9rem; flex:1; }
  .row { display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .price { font-size:1.15rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .stock { font-size:.8rem; color:var(--accent); font-weight:600; }
  .stock.low { color:var(--warn); }
  .stock.out { color:#b91c1c; }
  .msg { padding:40px 0; color:var(--muted); }
  footer { border-top:1px solid var(--line); color:var(--muted); font-size:.85rem; padding-block:18px; }
  footer a { color:inherit; }
</style>
</head>
<body>
<header><div class="wrap bar"><span class="logo">ShopHub</span><span class="tag">Cloud-native e-commerce demo</span></div></header>
<main class="wrap">
  <h1>Featured products</h1>
  <p class="sub">Served by a Flask API on Google Cloud Run, backed by PostgreSQL.</p>
  <div id="products" class="grid" aria-live="polite"></div>
  <p id="status" class="msg">Loading products...</p>
</main>
<footer><div class="wrap">Portfolio project. API: <a href="/api/products">/api/products</a> &middot; <a href="/health">/health</a></div></footer>
<script>
  const COLORS = ["#0b6e4f", "#1d4e89", "#9a3412", "#6b21a8", "#0f766e"];
  const grid = document.getElementById("products");
  const status = document.getElementById("status");

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function card(p, i) {
    const c = el("article", "card");
    const tile = el("div", "tile", p.name.charAt(0).toUpperCase());
    tile.style.background = COLORS[i % COLORS.length];
    const body = el("div", "body");
    body.append(el("div", "name", p.name), el("div", "desc", p.description || ""));
    const row = el("div", "row");
    row.append(el("span", "price", "$" + p.price.toFixed(2)));
    let label = "In stock", cls = "stock";
    if (p.stock === 0) { label = "Out of stock"; cls = "stock out"; }
    else if (p.stock <= 5) { label = "Only " + p.stock + " left"; cls = "stock low"; }
    row.append(el("span", cls, label));
    body.append(row);
    c.append(tile, body);
    return c;
  }

  fetch("/api/products")
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(items => {
      if (!items.length) { status.textContent = "No products yet."; return; }
      items.forEach((p, i) => grid.append(card(p, i)));
      status.hidden = true;
    })
    .catch(() => { status.textContent = "Could not load products. Please try again shortly."; });
</script>
</body>
</html>
